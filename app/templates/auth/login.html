{% extends 'base.html' %}
{% block title %}Sign in · HireHub{% endblock %}
{% block content %}
<section class="auth-panel">
  <div class="eyebrow">Welcome to HireHub</div>
  <h1>Sign in</h1>
  <p>Continue to your workspace.</p>
  {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
  <form method="post" data-api-url="{{ url_for('auth_api.login') }}" data-api-method="POST" data-api-redirect="{{ url_for('dashboard.index') }}">
    <input type="hidden" name="next" value="{{ next or '' }}">
    <div class="mb-3">
      <label class="form-label" for="email">Email address</label>
      <input id="email" class="form-control" type="email" name="email" autocomplete="email" value="{{ request.form.get('email', '') }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input id="password" class="form-control" type="password" name="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary w-100" type="submit">Sign in</button>
  </form>
  <p class="text-center mt-3 mb-0">New to HireHub? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</section>
{% endblock %}
